<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Bonus Calculator</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💠</text></svg>" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <!-- Sign in / sign up -->
  <main id="view-auth" class="auth-wrap" hidden>
    <section class="auth-card" aria-labelledby="auth-title">
      <div class="brand-mark" aria-hidden="true">💠</div>
      <h1 id="auth-title">Bonus Calculator</h1>
      <p class="tagline">Track revenue, productivity, and bonus progress.</p>

      <div class="tabs" role="tablist" aria-label="Sign in or create an account">
        <button type="button" role="tab" id="tab-login" aria-selected="true">Log in</button>
        <button type="button" role="tab" id="tab-signup" aria-selected="false">Sign up</button>
      </div>

      <form id="auth-form" novalidate>
        <div class="field" id="field-name" hidden>
          <label for="input-name">Name</label>
          <input id="input-name" name="name" type="text" autocomplete="name" maxlength="80" placeholder="Redi" />
        </div>
        <div class="field">
          <label for="input-email">Email</label>
          <input id="input-email" name="email" type="email" autocomplete="email" required placeholder="you@company.com" />
        </div>
        <div class="field">
          <label for="input-password">Password</label>
          <input id="input-password" name="password" type="password" autocomplete="current-password" required minlength="8" placeholder="At least 8 characters" />
        </div>

        <p id="auth-error" class="form-error" role="alert" hidden></p>

        <button type="submit" class="btn btn-primary" id="auth-submit">Log in</button>
      </form>
    </section>
  </main>

  <!-- Signed-in homepage -->
  <div id="view-home" hidden>
    <header class="topbar">
      <div class="topbar-brand"><span aria-hidden="true">💠</span> Bonus Calculator</div>
      <div class="topbar-user">
        <span id="user-email" class="user-email"></span>
        <button type="button" class="btn btn-ghost" id="btn-logout">Log out</button>
      </div>
    </header>

    <main class="home-wrap">
      <section class="card welcome-card">
        <h2 id="welcome-title">Welcome back</h2>
        <p class="welcome-copy">
          You're signed in. Your performance dashboard — revenue goals, client
          projects, productivity, and the bonus progress dial — is coming next.
        </p>
      </section>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
